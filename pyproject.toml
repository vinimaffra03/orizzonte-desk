[project]
name = "orizzonte-desk"
version = "0.1.0"
description = "Terminal-first quantitative swing trading research and execution desk for Hyperliquid."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Orizzonte Desk" }]
dependencies = [
  "duckdb>=1.2,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "hyperliquid-python-sdk==0.24.0",
  "jinja2>=3.1,<4",
  "joblib>=1.4,<2",
  "lightgbm>=4.5,<5",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "plotly>=6,<7",
  "polars>=1.20,<2",
  "pyarrow>=18,<24",
  "pydantic>=2.10,<3",
  "rich>=13.9,<15",
  "scikit-learn>=1.6,<2",
  "textual>=1.0,<2",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
  "websockets>=14,<17",
]

[dependency-groups]
dev = [
  "hypothesis>=6.120,<7",
  "mypy>=1.14,<2",
  "pandas-stubs>=2.2,<3",
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-requests>=2.32,<3",
]

[project.scripts]
orizzonte = "orizzonte_desk.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orizzonte_desk"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --basetemp=.tmp/pytest --cov=orizzonte_desk --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "E501", "RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
packages = ["orizzonte_desk"]

[[tool.mypy.overrides]]
module = [
  "hyperliquid.*",
  "joblib",
  "lightgbm.*",
  "plotly.*",
  "sklearn.*",
]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["orizzonte_desk"]
omit = [
  "src/orizzonte_desk/__main__.py",
  "src/orizzonte_desk/cli.py",
  "src/orizzonte_desk/daemon.py",
  "src/orizzonte_desk/tui.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
